# The session name gets cutoff too easily without this
set -g status-left-length 40

# Make status right prefix
# `#{S:#{W:...}}` loops every window to show a `!` if any window has a bell
# (E.g., if we have too many windows and the one with a bell isn't visible)
# Leading space to separate from `>` indicating more windows 
# (Without this we get `>aresdev` when there are too many windows)
# Host is truncated to 10 characters including a trailing `>` marker
# Path is truncated to 20 characters including a leading `<` marker (Matching
# `%20<\<<%~%<<` in the zsh prompt, `#{=/-20/<:...}` would add the marker on top)
# `@rk_path` abbreviates the home directory to `~` to match zsh's `%~`
set -g @rk_path '#{s|^#{HOME}/|~/|:#{s|^#{HOME}$|~|:pane_current_path}}'
# Max length: 1 (leading space) + 2 (bell `! `) + 10 (host) + 1 (`:`) + 20
# (path) + 13 (` -- PREFIX --`) + 1 (trailing space) = 48
set -g status-right-length 50
set -g status-right ' #{?#{S:#{W:#{?window_bell_flag,!,}}},#[reverse]!#[default] ,}#{?#{SSH_CONNECTION},#{?#{e|>|:#{n:host},10},#{=/9:host}>,#{host}}:,}#{?#{e|>|:#{n:#{E:@rk_path}},20},<#{=/-19:#{E:@rk_path}},#{E:@rk_path}}#{?client_prefix, -- PREFIX --,} '
# Redraw the status when the active pane changes so the path follows it
# (Otherwise it waits for the next `status-interval` refresh)
set-hook -g window-pane-changed 'refresh-client -S'

# Just bold
set -g window-status-current-style fg=default,bold


# Active
setw -g window-active-style fg=terminal,bg=terminal
# Inactive
setw -g window-style fg=colour250,bg=colour235
